<div id="chap"><b></b><span></span></div><div id="cap"></div><div id="handle"></div></div>
<script>

// ---------- the camera: 3D points projected through a camera that dollies, orbits and shakes ----------

// ---------- the world's backdrop: deep dust you fly through, streaking at warp speed ----------

// ---------- glow helpers ----------

const SHARDS = [...Array(380)].map((_, j) => ({x: (hash(j + 900) - .5) * 440, y: (hash(j + 901) - .5) * 240 - 30, vx: (hash(j + 902) - .5) * 900, vy: (hash(j + 903) - .5) * 700 - 120, vz: -hash(j + 904) * 900, r: 1 + hash(j + 905) * 2.6, w: hash(j + 906)}));

    cx.font = "500 12px 'JetBrains Mono'"; cx.fillStyle = '#8C93A6'; cx.fillText('PROMPT', x0 + 18, y0 - 10);

// ---------- act 2: the stream condenses into token blocks; each block unfolds into a column of numbers ----------
for (let i = 0; i < NT; i++) { snd(11 + i * .28, 'pop'); }

const VEC = [...Array(NT * 14)].map((_, j) => .15 + .85 * hash(j + 2100));
