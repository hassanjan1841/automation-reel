name: Weekly

on:
  schedule:
    - cron: '0 10 * * 0' # Sundays 10:00 UTC
  workflow_dispatch:
    inputs:
      post_carousel:
        description: Also write and post this week's carousel for real (the Sunday schedule always does)
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: reels-queue
  cancel-in-progress: false

jobs:
  refresh-token:
    # Long-lived Instagram tokens expire after 60 days; a weekly refresh keeps it alive.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - run: pip install requests

      - name: Refresh IG_TOKEN
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: python refresh_token.py

  carousel:
    # The weekly cheat-sheet carousel (saves-driven), posted alongside the daily reel. A manual run posts it only
    # when post_carousel is ticked, so the token can be refreshed by hand without posting.
    needs: refresh-token
    if: github.event_name == 'schedule' || inputs.post_carousel
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Install Claude Code
        uses: ./.github/actions/claude
        with:
          token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          backup: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_2 }}

      - name: Write, review and post the carousel
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python carousel.py

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: carousel
          path: out/carousel/*.jpg
          retention-days: 14

      - name: Record it
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add carousels.json 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Posted the weekly carousel'
          git pull --rebase origin ${{ github.ref_name }}
          git push
