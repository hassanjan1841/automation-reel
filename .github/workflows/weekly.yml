name: Weekly

on:
  schedule:
    - cron: '0 10 * * 0' # Sundays 10:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: reels-queue
  cancel-in-progress: false

jobs:
  refresh-token:
    # Long-lived Instagram tokens expire after 60 days; a weekly refresh keeps it alive.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - run: pip install requests

      - name: Refresh IG_TOKEN
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: python refresh_token.py

  learn:
    # Measure every post, judge the rules and the weekly test, write rules for the writer (rules.json ->
    # learnings.md) and a report for the creator. The data files are only written here (see history.py).
    needs: refresh-token
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - run: pip install requests pillow numpy

      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Learn from the week
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          EXPERIMENT: ${{ vars.EXPERIMENT }}
        run: python learn.py

      - name: Save the rules and send the report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f out/report.md ]; then
            gh issue create --title "Weekly reel report $(date -u +%Y-%m-%d)" --body-file out/report.md
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for f in learnings.md rules.json experiments.json ideas.json metrics reports; do
            if [ -e "$f" ]; then git add "$f"; fi
          done
          if git diff --cached --quiet; then echo 'No new learnings'; exit 0; fi
          git commit -m 'Weekly learnings'
          git pull --rebase origin ${{ github.ref_name }}
          git push

  carousel:
    # The weekly cheat-sheet carousel (saves-driven), posted alongside the daily reel.
    needs: learn
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Write, review and post the carousel
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: python carousel.py

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: carousel
          path: out/carousel/*.jpg
          retention-days: 14

      - name: Record it
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add carousels.json 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Posted the weekly carousel'
          git pull --rebase origin ${{ github.ref_name }}
          git push
