name: Weekly content

on:
  schedule:
    - cron: '0 10 * * 0' # Sundays 10:00 UTC
  workflow_dispatch:
    inputs:
      force:
        description: Generate 14 reels even if the queue is not low
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: reels-queue
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Top up the queue
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: python generate.py ${{ inputs.force && '--force' || '' }}

      - name: Validate queue
        run: python generate.py --check

      - name: Commit queue
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reels.json
          if git diff --cached --quiet; then echo 'Queue unchanged'; exit 0; fi
          git commit -m 'Add new reels to the queue'
          git pull --rebase origin ${{ github.ref_name }}
          git push

  refresh-token:
    # Long-lived Instagram tokens expire after 60 days; a weekly refresh keeps it alive.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - run: pip install requests

      - name: Refresh IG_TOKEN
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: python refresh_token.py
