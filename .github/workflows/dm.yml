name: Comment DMs

on:
  schedule:
    # Backup only: GitHub fires this every few hours at best; scheduler.py starts it every 10 minutes (mode send).
    - cron: '4,19,34,49 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: send, dry_run (print only) or check (token permissions only)
        type: choice
        options: [send, dry_run, check]
        default: check

permissions:
  contents: read
  issues: write

concurrency:
  group: comment-dms
  cancel-in-progress: false

jobs:
  dm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - run: pip install requests numpy pillow

      - name: Install Claude Code
        if: inputs.mode != 'check'
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Answer new comments
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.mode == 'dry_run' && 'true' || 'false' }}
        run: python dm.py ${{ inputs.mode == 'check' && '--check' || '' }}
