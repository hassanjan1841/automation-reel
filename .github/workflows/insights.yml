name: Insights

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  insights:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - run: pip install requests

      - name: Reel insights
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python insights.py 60

      - uses: actions/upload-artifact@v7
        with:
          name: thumbs
          path: out/thumbs
          retention-days: 7
