name: Tests

on:
  push:
    paths-ignore:
      - reels.json
      - metrics/**
      - reports/**
  pull_request:

permissions:
  contents: read

jobs:
  learning-loop:
    # Offline tests of the learning loop (test_learn.py). Only the packages the learning job (learn.yml) installs, so a
    # new import that job lacks fails here first.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - run: pip install requests pillow numpy

      - run: python test_learn.py -v

  study:
    # Offline tests of study.py (test_study.py): measurements on synthetic ffmpeg videos, a fake Claude and YouTube.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install ffmpeg
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg

      - run: pip install requests pillow numpy

      - run: python test_study.py -v

  motion:
    # Renders every animation template of motion.py for real in headless Chromium (test_motion.py).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install packages and the browser
        run: |
          pip install requests pillow numpy "$(grep -i '^pygments' requirements.txt)" "$(grep -i '^playwright' requirements.txt)"
          python -m playwright install --with-deps chromium

      - name: Download fonts
        run: python render.py --fonts

      - run: python test_motion.py -v
