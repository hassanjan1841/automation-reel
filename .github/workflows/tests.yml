name: Tests

on:
  push:
    paths-ignore:
      - reels.json
      - metrics/**
      - reports/**
  pull_request:

permissions:
  contents: read

jobs:
  learning-loop:
    # Offline tests of the learning loop (test_learn.py). Only the packages the learning job (learn.yml) installs, so a
    # new import that job lacks fails here first.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - run: pip install requests pillow numpy

      - run: python test_learn.py -v

  study:
    # Offline tests of study.py (test_study.py): measurements on synthetic ffmpeg videos, a fake Claude and YouTube.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install ffmpeg
        uses: ./.github/actions/ffmpeg

      - run: pip install requests pillow numpy

      - run: python test_study.py -v

  motion:
    # Renders every animation template of motion.py for real in headless Chromium (test_motion.py), plus a real stage
    # reel and a real showcase (stage.py, showcase.py), which encode with ffmpeg.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install ffmpeg
        uses: ./.github/actions/ffmpeg

      - name: Install packages
        run: pip install requests pillow numpy "$(grep -i '^pygments' requirements.txt)" "$(grep -i '^playwright' requirements.txt)" "$(grep -i '^fonttools' requirements.txt)"

      - name: Install the browser
        uses: ./.github/actions/browser

      - name: Download fonts
        run: python render.py --fonts

      - run: python test_motion.py -v
