name: Scheduler

# GitHub drops many scheduled runs, so the Daily reel, Weekly, Learning and Study crons alone do not run reliably.
# This starts whatever is due and missing (see scheduler.py). It is safe to run at any time and any number of
# times, so an outside trigger can also dispatch it (see README, "Reliable timing").
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  issues: write   # ytlive.py keeps the "Live YouTube numbers" issue up to date

concurrency:
  group: scheduler
  cancel-in-progress: false

jobs:
  start-due-runs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Start what is due
        env:
          GH_TOKEN: ${{ github.token }}
          LEARN_DAYS: ${{ vars.LEARN_DAYS }}
          REEL_SLOTS: ${{ vars.REEL_SLOTS }}
          SHOWCASE_DAYS: ${{ vars.SHOWCASE_DAYS }}
        run: python scheduler.py

      - name: Live YouTube numbers
        # Views of recent Shorts every run (ytlive.py); YouTube trouble never fails the scheduler.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python ytlive.py
