name: Writer bench (temporary)
on:
  push:
    branches: [ccr-afb0146b-2z3836]
    paths: ['.github/workflows/writer-bench.yml', 'tests/bench_writer.py']
env:
  PYTHONUNBUFFERED: '1'
jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        effort: ['', 'medium', 'low']
        trial: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - uses: ./.github/actions/claude
        with:
          token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          backup: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_2 }}
      - name: Write one reel
        env:
          WRITER_EFFORT: ${{ matrix.effort }}
          TRIAL: ${{ matrix.trial }}
          SLOT: '1'
        run: python tests/bench_writer.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bench-${{ matrix.effort || 'default' }}-${{ matrix.trial }}
          path: out/bench-*.json
