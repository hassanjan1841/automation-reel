name: Daily reel

on:
  schedule:
    # Starts an hour early (4 PM Pakistan) to research, write, voice, render and review today's reel, then posts
    # at POST_AT_UTC (12:00, 5 PM Pakistan). Off the hour because GitHub delays jobs queued exactly on the hour.
    - cron: '7 11 * * *'
    # The second reel of the day: starts 3 PM UTC, posts at 16:00 UTC (9 PM Pakistan, noon New York). Off by default
    # (repo variable REEL_SLOTS, "1,3"): its scheduled run exits at once; set REEL_SLOTS to "1,2,3" to post it.
    - cron: '7 15 * * *'
    # The third reel: starts 19:07 UTC, posts at 20:00 UTC (1 AM Pakistan, 4 PM New York).
    - cron: '7 19 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Render only, do not post
        type: boolean
        default: true
      slot:
        description: Which reel of the day (1 how-to at 12:00, 2 evening reel at 16:00, 3 at 20:00 UTC)
        type: choice
        options: ['1', '2', '3']
        default: '1'
      three_d:
        description: '3D today (random: repo variable THREE_D, else THREE_D_CHANCE)'
        type: choice
        options: [random, 'on', 'off']
        default: random
      stage:
        description: 'Stage reel today (random: repo variable STAGE, else STAGE_CHANCE)'
        type: choice
        options: [random, 'on', 'off']
        default: random

permissions:
  contents: write
  issues: write   # the alert when Instagram refuses the token

concurrency:
  group: reels-queue
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install ffmpeg
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Download fonts
        run: python render.py --fonts

      - name: Cache screenshot browser
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('requirements.txt') }}

      - name: Install screenshot browser
        run: python -m playwright install --with-deps chromium

      - name: Cache voice and speech-to-text models
        uses: actions/cache@v6
        with:
          path: models
          key: kokoro-v1.0-whisper-small.en

      - name: Install Claude Code
        uses: ./.github/actions/claude
        with:
          token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          backup: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_2 }}

      - name: Render and publish
        id: publish
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          VOICE: ${{ vars.VOICE }}
          VOICE_ENGINE: ${{ vars.VOICE_ENGINE }}
          VOICE_SPEED: ${{ vars.VOICE_SPEED }}
          VOICE_PITCH: ${{ vars.VOICE_PITCH }}
          FISH_API_KEY: ${{ secrets.FISH_API_KEY }}
          FISH_MODEL: ${{ vars.FISH_MODEL }}
          FORCE_POST: ${{ vars.FORCE_POST }}
          SLOT: ${{ (github.event.schedule == '7 19 * * *' || inputs.slot == '3') && '3' || (github.event.schedule == '7 15 * * *' || inputs.slot == '2') && '2' || '1' }}
          POST_AT_UTC: ${{ (github.event.schedule == '7 19 * * *' || inputs.slot == '3') && '20:00' || (github.event.schedule == '7 15 * * *' || inputs.slot == '2') && '16:00' || vars.POST_AT_UTC }}
          TRENDING: ${{ vars.TRENDING }}
          THREE_D: ${{ github.event_name == 'workflow_dispatch' && inputs.three_d != 'random' && inputs.three_d || vars.THREE_D }}
          THREE_D_CHANCE: ${{ vars.THREE_D_CHANCE }}
          STAGE: ${{ github.event_name == 'workflow_dispatch' && inputs.stage != 'random' && inputs.stage || vars.STAGE }}
          STAGE_CHANCE: ${{ vars.STAGE_CHANCE }}
          EXPERIMENT: ${{ vars.EXPERIMENT }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          GRAPH_VERSION: ${{ vars.GRAPH_VERSION }}
          REEL_SLOTS: ${{ vars.REEL_SLOTS }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python publish.py

      - name: Alert when Instagram refuses the token
        # publish.check_login leaves out/alert.md: one open issue (GitHub emails you), a comment on it per failed run.
        if: failure() && hashFiles('out/alert.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          open=$(gh issue list --state open --search 'in:title "Instagram login failed"' --json number --jq '.[0].number')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body-file out/alert.md
          else
            gh issue create --title 'Instagram login failed: reels are not posting' --body-file out/alert.md
          fi

      - name: Post to LinkedIn
        # The same reel on the creator's LinkedIn profile (linkedin.py; does nothing without LINKEDIN_TOKEN). It may
        # fail without stopping the record of the Instagram post below.
        id: linkedin
        if: steps.publish.outputs.posted == 'true'
        continue-on-error: true
        env:
          LINKEDIN_TOKEN: ${{ secrets.LINKEDIN_TOKEN }}
          LINKEDIN_AUTHOR: ${{ vars.LINKEDIN_AUTHOR }}
          LINKEDIN_VERSION: ${{ vars.LINKEDIN_VERSION }}
        run: python linkedin.py reel ${{ steps.publish.outputs.reel_id }}

      - name: Alert when LinkedIn refuses the token
        if: steps.linkedin.outcome == 'failure' && hashFiles('out/linkedin-alert.md') != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          open=$(gh issue list --state open --search 'in:title "LinkedIn login expired"' --json number --jq '.[0].number')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body-file out/linkedin-alert.md
          else
            gh issue create --title 'LinkedIn login expired: posts are not going to LinkedIn' --body-file out/linkedin-alert.md
          fi

      - name: Pronunciation test
        run: python test_voice.py

      - name: Upload video
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reel-${{ github.run_number }}
          path: |
            out/*.mp4
            out/reel-*.json
          if-no-files-found: warn
          retention-days: 14

      - name: Commit queue
        # always(): once a reel is posted it must be recorded even if a later step failed (the pronunciation test),
        # or the Scheduler would see the slot as unposted and post it again.
        if: always() && steps.publish.outputs.posted == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reels.json pronounce.json
          git commit -m "Posted reel ${{ steps.publish.outputs.reel_id }}"
          git pull --rebase origin ${{ github.ref_name }}
          git push
