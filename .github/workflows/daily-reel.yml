name: Daily reel

on:
  schedule:
    # Starts an hour early (4 PM Pakistan) to research, write, voice, render and review today's reel, then posts
    # at POST_AT_UTC (12:00, 5 PM Pakistan). Off the hour because GitHub delays jobs queued exactly on the hour.
    - cron: '7 11 * * *'
    # The second reel of the day: starts 3 PM UTC, posts at 16:00 UTC (9 PM Pakistan, noon New York).
    - cron: '7 15 * * *'
    # The third reel: starts 19:07 UTC, posts at 20:00 UTC (1 AM Pakistan, 4 PM New York).
    - cron: '7 19 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Render only, do not post
        type: boolean
        default: true
      slot:
        description: Which reel of the day (2 is the evening reel)
        type: choice
        options: ['1', '2', '3']
        default: '1'
      three_d:
        description: 3D today (random follows THREE_D_CHANCE)
        type: choice
        options: [random, 'on', 'off']
        default: random

permissions:
  contents: write

concurrency:
  group: reels-queue
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install ffmpeg
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Download fonts
        run: python render.py --fonts

      - name: Cache screenshot browser
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('requirements.txt') }}

      - name: Install screenshot browser
        run: python -m playwright install --with-deps chromium

      - name: Cache voice and speech-to-text models
        uses: actions/cache@v6
        with:
          path: models
          key: kokoro-v1.0-whisper-small.en

      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Render and publish
        id: publish
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          VOICE: ${{ vars.VOICE }}
          VOICE_ENGINE: ${{ vars.VOICE_ENGINE }}
          VOICE_SPEED: ${{ vars.VOICE_SPEED }}
          FISH_API_KEY: ${{ secrets.FISH_API_KEY }}
          FISH_MODEL: ${{ vars.FISH_MODEL }}
          FORCE_POST: ${{ vars.FORCE_POST }}
          SLOT: ${{ (github.event.schedule == '7 19 * * *' || inputs.slot == '3') && '3' || (github.event.schedule == '7 15 * * *' || inputs.slot == '2') && '2' || '1' }}
          POST_AT_UTC: ${{ (github.event.schedule == '7 19 * * *' || inputs.slot == '3') && '20:00' || (github.event.schedule == '7 15 * * *' || inputs.slot == '2') && '16:00' || vars.POST_AT_UTC }}
          TRENDING: ${{ vars.TRENDING }}
          THREE_D: ${{ github.event_name == 'workflow_dispatch' && inputs.three_d != 'random' && inputs.three_d || vars.THREE_D }}
          THREE_D_CHANCE: ${{ vars.THREE_D_CHANCE }}
          EXPERIMENT: ${{ vars.EXPERIMENT }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python publish.py

      - name: Pronunciation test
        run: python test_voice.py

      - name: Upload video
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reel-${{ github.run_number }}
          path: |
            out/*.mp4
            out/reel-*.json
          if-no-files-found: warn
          retention-days: 14

      - name: Commit queue
        if: steps.publish.outputs.posted == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reels.json pronounce.json
          git commit -m "Posted reel ${{ steps.publish.outputs.reel_id }}"
          git pull --rebase origin ${{ github.ref_name }}
          git push
