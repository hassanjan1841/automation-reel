name: Token refresh

on:
  schedule:
    - cron: '0 10 * * 0' # Sundays 10:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh-token:
    # Long-lived Instagram tokens expire after 60 days; a weekly refresh keeps it alive.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - run: pip install requests

      - name: Refresh IG_TOKEN
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: python refresh_token.py
